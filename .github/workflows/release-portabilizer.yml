# Собирает Portabilizer.exe на сервере GitHub и прикладывает zip к релизу.
# Как пользоваться: допишите раздел "## v8.10" в CHANGELOG.md, поднимите APP_VERSION, создайте тег v8.10.
# Релиз с готовым exe и описанием из CHANGELOG появится сам, лаунчер у людей предложит обновиться.
name: Release Portabilizer
on:
  push:
    tags: ["v*"]
  workflow_dispatch:            # ручной запуск кнопкой Run workflow: укажите тег, например v8.9
    inputs:
      tag:
        description: "Тег версии (например v8.9)"
        required: true
env:
  TAG: ${{ inputs.tag || github.ref_name }}
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller psutil
      - name: Build
        shell: pwsh
        run: |
          $add = @("--add-binary","7z.exe;.","--add-binary","7z.dll;.","--add-binary","innoextract.exe;.","--add-data","dx;dx")
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Portabilizer --icon "assets\portabilizer.ico" @add portabilizer_v8.py
      - name: Pack
        shell: pwsh
        run: |
          $n = "Portabilizer-${{ env.TAG }}"
          New-Item -ItemType Directory $n | Out-Null
          Copy-Item dist\Portabilizer.exe $n\
          Copy-Item assets\portabilizer_R.ico $n\
          Compress-Archive -Path $n -DestinationPath "$n.zip"
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ env.TAG }}"
          $n = "Portabilizer-$tag"
          # описание берём из раздела "## vX.Y" файла CHANGELOG.md
          $ver = $tag -replace '^[vV]',''
          $text = Get-Content CHANGELOG.md -Raw -Encoding UTF8
          $m = [regex]::Match($text, "(?ms)^##\s+[vV]?" + [regex]::Escape($ver) + "\s*\r?\n(.*?)(?=^##\s|\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "Portabilizer $tag" }
          Set-Content notes.md $notes -Encoding UTF8
          gh release create $tag "$n.zip" "dist\Portabilizer.exe" --title "Portabilizer $tag" --notes-file notes.md
