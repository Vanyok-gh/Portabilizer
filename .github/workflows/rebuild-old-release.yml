# Для старых релизов, где вместо программы приложен архив исходников: собирает из него Portabilizer.exe,
# прикладывает exe и zip к тому же релизу, а архив исходников убирает. Запуск: Actions -> Rebuild old release -> Run workflow, тег (например v8.8).
name: Rebuild old release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег существующего релиза (например v8.8)"
        required: true
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller psutil
      - name: Download sources of the release
        shell: pwsh
        run: |
          gh release download $env:TAG --repo ${{ github.repository }} --pattern "*.zip" --dir src
          Get-ChildItem src\*.zip | ForEach-Object { Expand-Archive $_.FullName -DestinationPath work -Force }
          $py = Get-ChildItem work -Recurse -Filter portabilizer_v8.py | Select-Object -First 1
          if (-not $py) { throw "В релизе нет исходников portabilizer_v8.py" }
          "SRC=$($py.DirectoryName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Build
        shell: pwsh
        working-directory: ${{ env.SRC }}
        run: |
          $add = @()
          if (Test-Path 7z.exe) { $add += "--add-binary","7z.exe;." }
          if (Test-Path 7z.dll) { $add += "--add-binary","7z.dll;." }
          if (Test-Path innoextract.exe) { $add += "--add-binary","innoextract.exe;." }
          if (Test-Path dx) { $add += "--add-data","dx;dx" }
          $ico = @(); if (Test-Path assets\portabilizer.ico) { $ico = @("--icon","assets\portabilizer.ico") }
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Portabilizer @ico @add portabilizer_v8.py
      - name: Pack and upload
        shell: pwsh
        working-directory: ${{ env.SRC }}
        run: |
          $n = "Portabilizer-$env:TAG"
          New-Item -ItemType Directory $n | Out-Null
          Copy-Item dist\Portabilizer.exe $n\
          if (Test-Path assets\portabilizer_R.ico) { Copy-Item assets\portabilizer_R.ico $n\ }
          Compress-Archive -Path $n -DestinationPath "$n.zip"
          gh release upload $env:TAG "$n.zip" "dist\Portabilizer.exe" --repo ${{ github.repository }} --clobber
          $names = gh release view $env:TAG --repo ${{ github.repository }} --json assets --jq ".assets[].name"
          foreach ($a in $names) { if ($a -match '^portabilizer_v\d.*\.zip$') { gh release delete-asset $env:TAG $a --repo ${{ github.repository }} --yes } }
